services:
  tiketbisa-fe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_INTERNAL_BASE_URL: ${VITE_API_INTERNAL_BASE_URL}
        VITE_GOOGLE_AUTH_CLIENT_ID: ${VITE_GOOGLE_AUTH_CLIENT_ID}
    ports:
      - "3000:3000"
    restart: unless-stopped
