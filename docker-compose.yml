services:
  tiketbisa-fe:
    image: ${FRONTEND_IMAGE:-tiketbisa-fe:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_INTERNAL_BASE_URL: ${VITE_API_INTERNAL_BASE_URL}
        VITE_GOOGLE_AUTH_CLIENT_ID: ${VITE_GOOGLE_AUTH_CLIENT_ID}
        VITE_MANUAL_TRANSFER_BANK_NAME: ${VITE_MANUAL_TRANSFER_BANK_NAME}
        VITE_MANUAL_TRANSFER_ACCOUNT_NUMBER: ${VITE_MANUAL_TRANSFER_ACCOUNT_NUMBER}
        VITE_MANUAL_TRANSFER_ACCOUNT_HOLDER: ${VITE_MANUAL_TRANSFER_ACCOUNT_HOLDER}
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          # SSR rendering is CPU-bound, so the frontend is capped at one of the VM's two vCPUs.
          # Without this it can starve the colocated backend and PostgreSQL during a traffic spike.
          cpus: "1.0"
          memory: 512M
