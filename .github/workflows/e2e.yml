name: Frontend Release E2E

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: Deployed frontend URL to test
        required: true
        type: string
      api_url:
        description: Backend URL used by the E2E helpers
        required: true
        type: string

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    environment: production
    env:
      E2E_BASE_URL: ${{ inputs.frontend_url }}
      E2E_API_BASE_URL: ${{ inputs.api_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
